create_usage_alert_rule:
  fields:
    device:
      required: true
      selector:
        device:
          integration: flume_ng
    name:
      required: true
      selector:
        text:
          type: text
    flow_rate:
      required: true
      selector:
        number:
          min: 0
          max: 40.9
          step: 0.1
          unit_of_measurement: gal/min
          mode: box
    duration:
      required: true
      selector:
        number:
          min: 5
          max: 1439
          step: 1
          unit_of_measurement: min
          mode: box
    notify_every:
      selector:
        number:
          min: 10
          max: 20100
          step: 1
          unit_of_measurement: min
          mode: box
    active:
      default: true
      selector:
        boolean:
    payload:
      selector:
        object:

